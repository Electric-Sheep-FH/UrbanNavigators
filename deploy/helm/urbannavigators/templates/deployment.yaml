{{- range $name, $svc := .Values.services }}
{{- $cfg := include "un.config" (dict "ctx" $ "svc" $svc) | fromYaml }}
{{- $ctx := dict "ctx" $ "name" $name }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "un.labels" $ctx | nindent 4 }}
spec:
  {{- if not $cfg.autoscaling.enabled }}
  replicas: {{ $cfg.replicas }}
  {{- end }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      {{- include "un.selectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "un.labels" $ctx | nindent 8 }}
    spec:
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ $name }}
          image: "{{ $.Values.image.registry }}/{{ $.Values.image.prefix }}{{ $name }}:{{ $.Values.image.tag }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ $cfg.port }}
          env:
            - name: PORT
              value: {{ $cfg.port | quote }}
            - name: OTEL_SERVICE_NAME
              value: {{ $name }}
            - name: APP_VERSION
              value: {{ $.Values.image.tag | quote }}
            {{- range $key, $value := merge (deepCopy $cfg.env) $.Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ $name }}-secrets
                optional: true
          livenessProbe:
            httpGet:
              path: {{ $cfg.probes.liveness }}
              port: http
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: {{ $cfg.probes.readiness }}
              port: http
            periodSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml $cfg.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
