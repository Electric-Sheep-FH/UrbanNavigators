server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  # Sous Docker Compose, le front relaie l'API vers la gateway.
  # Sous Kubernetes, l'Ingress envoie directement /api à la gateway.
  location /api/ {
    proxy_pass http://gateway-bff:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Ressources fingerprintées par Vite : cache long (écoconception).
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Application monopage : toute route inconnue renvoie index.html.
  location / {
    try_files $uri /index.html;
  }
}
