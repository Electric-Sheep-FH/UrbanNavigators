# Secrets de DÉVELOPPEMENT uniquement (mêmes valeurs que compose.yaml et infra/postgres/init.sql).
# Le chart Helm monte automatiquement le Secret "<service>-secrets" dans le service correspondant.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-admin
stringData:
  POSTGRES_USER: urban
  POSTGRES_PASSWORD: urban
---
apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq-admin
stringData:
  RABBITMQ_DEFAULT_USER: urban
  RABBITMQ_DEFAULT_PASS: urban
---
apiVersion: v1
kind: Secret
metadata:
  name: identity-secrets
stringData:
  DATABASE_URL: postgres://identity:identity@postgres:5432/identity
---
apiVersion: v1
kind: Secret
metadata:
  name: mobility-data-secrets
stringData:
  DATABASE_URL: postgres://mobility:mobility@postgres:5432/mobility
  AMQP_URL: amqp://urban:urban@rabbitmq:5672
---
apiVersion: v1
kind: Secret
metadata:
  name: realtime-secrets
stringData:
  AMQP_URL: amqp://urban:urban@rabbitmq:5672
---
apiVersion: v1
kind: Secret
metadata:
  name: disruptions-secrets
stringData:
  DATABASE_URL: postgres://operations:operations@postgres:5432/operations
  AMQP_URL: amqp://urban:urban@rabbitmq:5672
---
apiVersion: v1
kind: Secret
metadata:
  name: notifications-secrets
stringData:
  DATABASE_URL: postgres://notifications:notifications@postgres:5432/notifications
  AMQP_URL: amqp://urban:urban@rabbitmq:5672
