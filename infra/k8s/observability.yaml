# Grafana + Tempo + Prometheus + Loki avec récepteur OTLP, en un seul pod (développement).
#   kubectl -n urbannavigators port-forward svc/observability 3001:3000  ->  http://localhost:3001
apiVersion: v1
kind: Service
metadata:
  name: observability
spec:
  selector:
    app.kubernetes.io/name: observability
  ports:
    - name: grafana
      port: 3000
    - name: otlp-grpc
      port: 4317
    - name: otlp-http
      port: 4318
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: observability
  template:
    metadata:
      labels:
        app.kubernetes.io/name: observability
    spec:
      containers:
        - name: lgtm
          image: grafana/otel-lgtm:0.11.0
          ports:
            - name: grafana
              containerPort: 3000
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 1Gi
