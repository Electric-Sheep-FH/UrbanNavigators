version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      nestjs:
        patterns: ["@nestjs/*"]
      opentelemetry:
        patterns: ["@opentelemetry/*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
    ignore:
      # Changer de version majeure de Node est une décision d'équipe (versions LTS paires uniquement),
      # pas une mise à jour automatique : Dependabot proposait Node 25, qui n'est pas LTS.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
