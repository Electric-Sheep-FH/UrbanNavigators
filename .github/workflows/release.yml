# Promotion en production du MÊME artefact que celui validé en staging (CDC §15.2, étape 6).
# Déclenchement manuel ; l'environnement GitHub "production" porte l'approbation de recette
# (Settings > Environments > production > Required reviewers).
name: Release production

on:
  workflow_dispatch:
    inputs:
      sha:
        description: SHA complet du commit de main validé en staging
        required: true
        type: string

permissions:
  contents: read
  packages: read

jobs:
  verify:
    name: Vérification des images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@v4
      - name: Signature de chaque image, émise par la CI de main
        run: |
          for dir in apps/*/; do
            image="ghcr.io/${OWNER,,}/un-$(basename "$dir"):$SHA"
            echo "==> $image"
            cosign verify "$image" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --certificate-identity "https://github.com/$REPO/.github/workflows/ci.yml@refs/heads/main" \
              > /dev/null
          done
        env:
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.repository }}
          SHA: ${{ inputs.sha }}

  deploy:
    name: Déploiement production
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://${{ vars.PRODUCTION_HOST }}
    concurrency: deploy-production
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}
      - uses: azure/setup-helm@v5
      - name: Accès au cluster
        run: |
          mkdir -p ~/.kube
          echo "$KUBECONFIG_B64" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
        env:
          KUBECONFIG_B64: ${{ secrets.PRODUCTION_KUBECONFIG }}
      - name: helm upgrade (rollback automatique en cas d'échec)
        run: |
          helm upgrade --install un deploy/helm/urbannavigators \
            --namespace urbannavigators --create-namespace \
            -f deploy/helm/urbannavigators/values-production.yaml \
            --set image.registry="ghcr.io/${OWNER,,}" \
            --set image.tag="$SHA" \
            --set ingress.host="$PRODUCTION_HOST" \
            --wait --timeout 10m --rollback-on-failure
        env:
          OWNER: ${{ github.repository_owner }}
          SHA: ${{ inputs.sha }}
          PRODUCTION_HOST: ${{ vars.PRODUCTION_HOST }}
      - name: Smoke tests
        run: helm test un --namespace urbannavigators --logs
